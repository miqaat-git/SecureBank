# Development profile skeleton. Select it explicitly (never the default):
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev,nodb
# Listen on the loopback interface only.
server.address=127.0.0.1

# Plain-HTTP localhost cannot carry a Secure cookie in every browser, so the Secure flag is
# relaxed here and ONLY here. HttpOnly and SameSite stay on (inherited from application.properties).
server.servlet.session.cookie.secure=false

# Local database through the application account. The URL has a localhost default; the
# credentials come only from the environment and have no default.
spring.datasource.url=${SB_DB_URL:jdbc:mysql://localhost:3306/securebank}
logging.level.com.securebank=DEBUG
