# SecureBank base configuration. These defaults are the PRODUCTION-SAFE settings:
# when no profile is selected the application behaves as production (blueprint 5.1).
# Environment-specific relaxations exist only in application-dev.properties.
spring.application.name=securebank

# JSP views live under WEB-INF so they can never be requested directly.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Session cookie: Secure, HttpOnly and SameSite=Lax (blueprint 5, 5.1, I1).
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=15m

# Never expose internals in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Database: the least-privilege APPLICATION account only. Values come from the environment
# and have no defaults, so a missing value stops startup instead of using a weak fallback.
spring.datasource.url=${SB_DB_URL}
spring.datasource.username=${SB_APP_DB_USER}
spring.datasource.password=${SB_APP_DB_PASSWORD}

# Hibernate only validates the schema. Flyway is never run by the application in Phase 0:
# migrations are a separate operator step with a separate account (docs/database-setup.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false
