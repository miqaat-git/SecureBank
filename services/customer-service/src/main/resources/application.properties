spring.application.name=customer-service
server.port=8081
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------------------------------------------------------------------------
# Database (application account: DML only, no DDL). No credentials in this file.
# Required environment variables: CUSTOMER_DB_USERNAME, CUSTOMER_DB_PASSWORD
# ---------------------------------------------------------------------------
spring.datasource.url=${CUSTOMER_DB_URL:jdbc:mysql://localhost:3306/securebank_customer}
spring.datasource.username=${CUSTOMER_DB_USERNAME}
spring.datasource.password=${CUSTOMER_DB_PASSWORD}
spring.datasource.hikari.pool-name=customer-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1740000

# ---------------------------------------------------------------------------
# Flyway owns the schema. It uses the separate MIGRATION account.
# Required environment variables: CUSTOMER_DB_MIGRATION_USERNAME, CUSTOMER_DB_MIGRATION_PASSWORD
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.url=${CUSTOMER_DB_URL:jdbc:mysql://localhost:3306/securebank_customer}
spring.flyway.user=${CUSTOMER_DB_MIGRATION_USERNAME}
spring.flyway.password=${CUSTOMER_DB_MIGRATION_PASSWORD}
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# JPA / Hibernate: validate the schema, never create or change it
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# JSON: reject unknown fields (stops clients from trying to set fields they must not set)
# ---------------------------------------------------------------------------
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------------------------------------------------------------------------
# Security (JWT resource server). Leave the issuer empty until Keycloak exists:
# the service then starts, but rejects every token (fail closed).
# ---------------------------------------------------------------------------
securebank.security.jwt.issuer-uri=${CUSTOMER_JWT_ISSUER_URI:}
securebank.security.jwt.admin-role=securebank-admin
securebank.security.jwt.staff-role=securebank-staff
securebank.security.public-api-docs=false

# ---------------------------------------------------------------------------
# API documentation: off by default; enabled by the "local" profile
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------------------------------------------------------------------------
# Actuator: only health is exposed, without details
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ---------------------------------------------------------------------------
# Error responses and logging: never leak internals
# ---------------------------------------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
logging.level.root=INFO
logging.level.com.securebank=INFO
logging.level.org.hibernate.SQL=WARN
