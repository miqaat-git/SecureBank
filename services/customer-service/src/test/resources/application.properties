# TEST-ONLY configuration. Uses an isolated in-memory H2 database (a new, uniquely named one per
# Spring context), never MySQL and never securebank_customer. No credentials of any kind.
spring.application.name=customer-service-test

spring.datasource.url=jdbc:h2:mem:customer_test_${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the test schema from the entity; Flyway (MySQL-specific scripts) is off in tests.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.jackson.deserialization.fail-on-unknown-properties=true

# Security stays ON in tests. No issuer is configured, so the real decoder rejects every token;
# authorised requests in tests use Spring Security Test's jwt() post-processor.
securebank.security.jwt.issuer-uri=
securebank.security.jwt.admin-role=securebank-admin
securebank.security.jwt.staff-role=securebank-staff
securebank.security.public-api-docs=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=WARN
