server:
  port: 8083
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: ledger-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # Runtime (least-privilege) account: SELECT + INSERT only. See docs/database/.
  datasource:
    url: ${LEDGER_DB_URL}
    username: ${LEDGER_DB_USERNAME}
    password: ${LEDGER_DB_PASSWORD}
    hikari:
      pool-name: ledger-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1500000

  # Migration account: DDL rights, used by Flyway only.
  flyway:
    enabled: true
    url: ${LEDGER_DB_URL}
    user: ${LEDGER_DB_MIGRATION_USERNAME}
    password: ${LEDGER_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Required. Example shape only: https://<keycloak-host>/realms/<realm>
          issuer-uri: ${LEDGER_JWT_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ledger:
  accounting:
    supported-currencies: INR
    max-amount-scale: 2
    max-line-amount: 100000000
    max-lines-per-entry: 200
  security:
    # true: /v3/api-docs and /swagger-ui are open. Set false to require a ledger read role.
    public-api-docs: true
    # Optional Keycloak client id whose client roles are also mapped (resource_access.<id>.roles).
    resource-client-id: ""

logging:
  level:
    root: INFO
    com.securebank.ledger: INFO
