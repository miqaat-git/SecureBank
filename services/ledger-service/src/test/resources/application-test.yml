# Test-only profile. Uses an in-memory H2 database (MySQL compatibility mode) so no real
# MySQL instance, credentials or Keycloak server is ever needed. Schema is still created by
# the real Flyway migration and checked by Hibernate (ddl-auto=validate).
spring:
  datasource:
    url: jdbc:h2:mem:ledger_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    url: jdbc:h2:mem:ledger_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    user: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Placeholder only; tests replace the JwtDecoder (see support/TestJwtDecoderConfig).
          issuer-uri: https://issuer.invalid/realms/securebank-test

management:
  endpoint:
    health:
      show-details: never
