# Test profile. Downstream base URLs are injected at runtime by the mock servers
# (see Downstreams.register). The issuer is a non-resolvable placeholder: tests replace the
# decoder with an in-memory one and never contact an identity provider.
securebank:
  security:
    jwt-issuer-uri: https://idp.securebank.invalid/realms/test
  timeouts:
    connect: 500ms
    response: 700ms
  cors:
    allowed-origins: https://app.securebank.test
  limits:
    max-request-body-size: 1KB
  # Generous limits so unrelated tests never trip the limiter; the rate-limit tests override these explicitly.
  rate-limit:
    rules:
      - name: default
        paths: /api/**
        anonymous: {limit: 100000, window: 1m}
        authenticated: {limit: 100000, window: 1m}
    auth-failure: {limit: 100000, window: 1m}


logging:
  level:
    com.securebank.gateway: WARN
