spring:
  application:
    name: securebank-api-gateway
  main:
    web-application-type: reactive
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  # Keycloak access tokens can be large; keep the limit explicit.
  max-http-request-header-size: 16KB

securebank:
  security:
    # Required. The gateway refuses to start without it (no unauthenticated fallback).
    jwt-issuer-uri: ${SECUREBANK_JWT_ISSUER_URI:}

  # Base URLs must be scheme://host[:port] with NO path. Paths are forwarded unchanged.
  services:
    customer-base-url: ${CUSTOMER_SERVICE_BASE_URL:http://localhost:8081}
    account-base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8082}
    ledger-base-url: ${LEDGER_SERVICE_BASE_URL:http://localhost:8083}
    transaction-base-url: ${TRANSACTION_SERVICE_BASE_URL:http://localhost:8084}

  timeouts:
    connect: ${SECUREBANK_CONNECT_TIMEOUT:2s}
    response: ${SECUREBANK_RESPONSE_TIMEOUT:15s}

  # Restrictive by default: no origin is allowed until configured.
  cors:
    allowed-origins: ${SECUREBANK_CORS_ALLOWED_ORIGINS:}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Correlation-Id,Idempotency-Key
    exposed-headers: X-Correlation-Id,Retry-After
    allow-credentials: false
    max-age: 1h

  limits:
    # Enforced against the Content-Length header (see README for chunked-body caveat).
    max-request-body-size: ${SECUREBANK_MAX_REQUEST_BODY_SIZE:1MB}

  # Rate limiting (see README "Rate limiting"). Everything below is configuration only.
  # store=memory keeps counters PER GATEWAY INSTANCE: it does not protect a multi-instance deployment. A shared
  # store needs a provisioned component and your own RateLimitStore bean; nothing is provisioned silently.
  rate-limit:
    enabled: ${SECUREBANK_RATE_LIMIT_ENABLED:true}
    store: memory
    max-keys: ${SECUREBANK_RATE_LIMIT_MAX_KEYS:10000}
    # IPs/CIDRs of reverse proxies whose X-Forwarded-For may be trusted. Empty = never trust the header.
    trusted-proxies: ${SECUREBANK_TRUSTED_PROXIES:}
    exempt-paths: /actuator/**,/internal/**
    auth-failure:            # failed token validations per client address before further bearer requests get 429
      limit: 20
      window: 1m
    rules:                   # first match wins; counters are separate per rule
      - name: funding
        paths: /api/admin/funding/**,/api/admin/funding
        methods: POST
        anonymous: {limit: 5, window: 1m}
        authenticated: {limit: 20, window: 1m}
      - name: transfers
        paths: /api/transactions/**
        methods: POST
        anonymous: {limit: 10, window: 1m}
        authenticated: {limit: 30, window: 1m}
      - name: admin
        paths: /api/admin/**
        anonymous: {limit: 10, window: 1m}
        authenticated: {limit: 120, window: 1m}
      - name: default
        paths: /api/**
        anonymous: {limit: 30, window: 1m}
        authenticated: {limit: 300, window: 1m}

  # Identity-related headers are never trusted from external callers; they are removed
  # before routing. Downstream services must derive identity from the validated JWT.
  headers:
    strip-request-headers:
      - x-user-id
      - x-user-name
      - x-user-email
      - x-user-role
      - x-user-roles
      - x-role
      - x-roles
      - x-customer-id
      - x-subject
      - x-authenticated-user
      - x-forwarded-user
      - remote-user
    strip-request-header-prefixes:
      - x-securebank-
      - x-internal-
      - x-auth-

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    com.securebank.gateway: INFO
    org.springframework.cloud.gateway: WARN
    reactor.netty: WARN
