# =====================================================================
# SecureBank Account Service - production-oriented configuration
# All credentials and URLs come from environment variables. Nothing secret is committed.
# =====================================================================
spring.application.name=account-service
server.port=8082
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Never leak internals in error pages (the API returns its own safe JSON errors)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ---------------------------------------------------------------- database (MySQL 8.0)
# Application user: SELECT/INSERT/UPDATE only (no DDL, no DELETE). See scripts/mysql-setup.sql
spring.datasource.url=${ACCOUNT_DB_URL}
spring.datasource.username=${ACCOUNT_DB_USERNAME}
spring.datasource.password=${ACCOUNT_DB_PASSWORD}
spring.datasource.hikari.pool-name=account-service-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.validation-timeout=3000

# ---------------------------------------------------------------- JPA / Hibernate
# validate = Hibernate only checks that the Flyway-created schema matches the entities. Never update/create.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ---------------------------------------------------------------- Flyway (separate migration account)
spring.flyway.enabled=true
spring.flyway.url=${ACCOUNT_DB_URL}
spring.flyway.user=${ACCOUNT_DB_MIGRATION_USERNAME}
spring.flyway.password=${ACCOUNT_DB_MIGRATION_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ---------------------------------------------------------------- JSON
# Reject unknown properties: a client sending e.g. "balance" in a create request gets 400, not silent acceptance.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.generator.write-bigdecimal-as-plain=true
spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------- actuator (health only)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------------------------------------------------------------- OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------- logging (no SQL, no payloads, no tokens)
logging.level.root=INFO
logging.level.com.securebank=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ---------------------------------------------------------------- Account Service settings
account.customer-service.base-url=${CUSTOMER_SERVICE_BASE_URL:http://localhost:8081}
account.customer-service.customer-path=/api/v1/customers/{customerId}
account.customer-service.connect-timeout=2s
account.customer-service.read-timeout=3s
account.customer-service.eligible-statuses=ACTIVE
account.customer-service.forward-caller-token=true

# Mandatory: Keycloak realm issuer, e.g. https://<keycloak-host>/realms/<realm>  (no default on purpose)
account.security.issuer-uri=${ACCOUNT_JWT_ISSUER_URI}
account.security.audience=${ACCOUNT_JWT_AUDIENCE:}
account.security.customer-id-claim=customer_id
account.security.resource-client-id=securebank-account-service

account.limits.max-open-accounts-per-customer=5
