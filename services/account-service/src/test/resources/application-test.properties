# Test-only configuration (profile "test"). Never used in production.
# Isolated in-memory H2 database, unique per Spring context. The real MySQL database is never touched.
spring.datasource.url=jdbc:h2:mem:accounttest_${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema generated from the entities for the isolated test database. The Flyway script is covered by
# FlywayMigrationContractTest (static check against the entity mappings); see README "Known limitations".
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.flyway.url=
spring.flyway.user=
spring.flyway.password=

# Non-functional placeholder: tests never contact an identity provider (a stub JwtDecoder rejects raw tokens).
account.security.issuer-uri=https://issuer.invalid.test/realms/securebank
account.customer-service.base-url=http://customer-service.invalid.test

logging.level.com.securebank=WARN
